<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffc800" />

    <!--
      Static fallback metadata.

      React replaces these per route once it has hydrated. They exist for the
      crawlers and link unfurlers that do not execute JavaScript, so a shared
      link is never titled "Vite + React".
    -->
    <title>Sahil Zagade · Cybersecurity &amp; Security Engineering</title>
    <meta
      name="description"
      content="Cybersecurity and security engineering portfolio of Sahil Zagade. Projects, a hands-on Cyber Lab, and a custom-built first-party analytics platform running on Node.js, Express and PostgreSQL."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sahil Zagade · Cybersecurity &amp; Security Engineering" />
    <meta
      property="og:description"
      content="Projects, a hands-on Cyber Lab, and a custom-built first-party analytics platform."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; line-height: 1.6;">
        <h1 style="font-size: 1.6rem;">Sahil Zagade</h1>
        <p>Cybersecurity &middot; Cloud &middot; Security Engineering</p>
        <p>This portfolio needs JavaScript to run. Nothing is tracked while JavaScript is disabled, because the analytics client never loads.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
